services:
  greenmail:
    image: greenmail/standalone:2.1.0
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.all
        -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.users=tester:testpass@localhost
        -Dgreenmail.verbose
    ports:
      - '3143:3143'
      - '3025:3025'
